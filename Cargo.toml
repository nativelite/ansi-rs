[package]
name = "nativelite-ansi"
version = "0.4.1"
edition = "2021"
rust-version = "1.70"
description = "ANSI/VT terminal output as data: styled-output building, incremental escape-sequence parsing, and screen-diff rendering, using only the Rust standard library."
license = "MIT"
repository = "https://github.com/nativelite/ansi-rs"
keywords = ["ansi", "vt100", "terminal", "tui", "nativelite"]
categories = ["command-line-interface", "parser-implementations"]

# nativelite core rule: ZERO third-party dependencies. Do not add to this.
[dependencies]

[lib]
name = "ansi"
path = "src/lib.rs"

# Stdlib-only benches (see benches/README.md). `harness = false`: a `main()`
# timing with std::time::Instant; under `cargo test` they build and return.
[[bench]]
name = "history_memory"
harness = false

[[bench]]
name = "feed_throughput"
harness = false
